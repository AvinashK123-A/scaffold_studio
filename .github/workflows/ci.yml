# Checks every pull request and every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Analyze and test (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The newest stable release and the minimum supported version.
        flutter: [stable, 3.38.0]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter == 'stable' && '' || matrix.flutter }}
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        if: matrix.flutter == 'stable'
        run: |
          dart format lib test example/lib example/test example/integration_test
          git diff --exit-code

      - name: Analyze
        if: matrix.flutter == 'stable'
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Analyze and test the example
        working-directory: example
        run: |
          flutter pub get
          if [ "${{ matrix.flutter }}" = "stable" ]; then flutter analyze; fi
          flutter test

      - name: Validate the package for pub.dev
        if: matrix.flutter == 'stable'
        run: dart pub publish --dry-run
